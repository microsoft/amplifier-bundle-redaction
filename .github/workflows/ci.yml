name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Library tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run library tests
        run: uv run pytest tests/ -q --tb=short

  test-hook:
    name: Hook tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: modules/hook-redaction
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # The hook does NOT declare amplifier_core as a dependency (it's
      # host-provided at runtime by whatever composes this module). CI
      # supplies it ad-hoc for the test run via `uv run --with`.
      #
      # Pinned to the published PyPI wheel, NOT `git+...@main`. amplifier-core
      # is a Rust/PyO3 extension (see its Cargo.toml) -- installing it from a
      # git ref forces uv to compile it from source on every single run, on
      # every Python version in the matrix, on a cold CI runner with no build
      # cache. Measured locally with a cold uv cache: that source build alone
      # took ~4m30s, and it re-resolves whatever HEAD of amplifier-core#main
      # happens to be at run time -- a moving, un-pinned target that can break
      # this job for reasons entirely outside this repo. amplifier-core
      # publishes prebuilt wheels to PyPI for macOS/manylinux/Windows (abi3,
      # no compiler needed), which is what real hosts of this module install
      # anyway -- so depend on that instead.
      - name: Run hook tests (amplifier_core supplied for the test run only)
        run: uv run --with "amplifier-core>=1.6.0" pytest tests/ -q --tb=short

  build:
    name: Build library wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build wheel
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  zero-deps-contract:
    name: Zero-dependency contract
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Install --no-deps into an isolated venv so no other amplifier_*
      # package can be dragged in transitively -- this is the negative-
      # dependency test, load-bearing per the bundle's zero-deps contract.
      - name: Install wheel --no-deps into a clean venv
        run: |
          uv venv .zero-deps-venv
          uv pip install --python .zero-deps-venv/bin/python --no-deps dist/*.whl

      - name: Run zero-deps check (import + call mask_text/scrub, fail if amplifier_core loads)
        run: .zero-deps-venv/bin/python scripts/zero_deps_check.py
